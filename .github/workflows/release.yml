name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Tag gegen Version prüfen
        shell: pwsh
        run: scripts/check-version.ps1 -Tag "$env:GITHUB_REF_NAME"
      - name: Tests
        run: dotnet test --configuration Release
      - name: Artefakte bauen
        shell: pwsh
        run: scripts/publish.ps1 -Output artifacts
      - name: Release Notes extrahieren
        shell: pwsh
        run: scripts/extract-changelog.ps1 -Version "$env:GITHUB_REF_NAME" | Set-Content -Encoding utf8 release-notes.md
      - name: GitHub Release erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem artifacts -File | ForEach-Object FullName
          gh release create "$env:GITHUB_REF_NAME" @assets --title "$env:GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
