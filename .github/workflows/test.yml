name: Tests

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Versionen prüfen
        shell: pwsh
        run: scripts/check-version.ps1
      - name: Changelog-Extraktion prüfen
        shell: pwsh
        run: scripts/extract-changelog.ps1 -Version 1.0.0
      - name: Formatierung
        run: dotnet format --verify-no-changes
      - name: Build
        run: dotnet build --configuration Release
      - name: Tests
        run: dotnet test --configuration Release --no-build
      - name: Extension prüfen
        working-directory: extensions/vscode
        run: |
          npm ci --no-fund --no-audit
          npm run lint
          npm run typecheck
